apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: lifelearn
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi # 필요에 따라 용량 조절

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: es-pvc
  namespace: lifelearn
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi # 필요에 따라 용량 조절

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data-pvc
  namespace: lifelearn
spec:
  accessModes:
    - ReadWriteOnce # 여러 파드에서 동시 쓰기가 필요하면 ReadWriteMany 필요 (NFS 등)
  resources:
    requests:
      storage: 5Gi
