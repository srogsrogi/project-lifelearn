apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifelearn-db
  namespace: lifelearn
  labels:
    app: lifelearn-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lifelearn-db
  template:
    metadata:
      labels:
        app: lifelearn-db
    spec:
      containers:
      - name: db
        image: ankane/pgvector:latest
        ports:
        - containerPort: 5432
        envFrom:
        - configMapRef:
            name: lifelearn-config
        - secretRef:
            name: lifelearn-secret
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
        # 헬스체크
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "lifelearn", "-d", "lifelearn"]
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: db-data
        persistentVolumeClaim:
          claimName: postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: lifelearn-db
  namespace: lifelearn
spec:
  selector:
    app: lifelearn-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
