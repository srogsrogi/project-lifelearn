apiVersion: v1
kind: ConfigMap
metadata:
  name: lifelearn-config
  namespace: lifelearn
data:
  # Django 설정
  DJANGO_SETTINGS_MODULE: "config.settings.prod"
  DJANGO_ALLOWED_HOSTS: "*" # 실제 운영 시 도메인으로 변경 권장
  
  # DB 접속 정보 (Service 이름 사용)
  POSTGRES_DB: "lifelearn"
  POSTGRES_USER: "lifelearn"
  POSTGRES_HOST: "lifelearn-db"
  POSTGRES_PORT: "5432"
  
  # Elasticsearch 접속 정보 (Service 이름 사용)
  ES_URL: "http://lifelearn-es:9200"
  
  # 기타
  TZ: "Asia/Seoul"

---
apiVersion: v1
kind: Secret
metadata:
  name: lifelearn-secret
  namespace: lifelearn
type: Opaque
stringData:
  #TODO .env.prod.example 기반 플레이스홀더 (배포 전 실제 값으로 교체 필요)
  SECRET_KEY: "change-me-to-secure-key"
  GOOGLE_CLIENT_ID: "your-google-client-id"
  GOOGLE_SECRET_KEY: "your-google-secret-key"
  POSTGRES_PASSWORD: "your-strong-password-here"
  GMS_KEY: "your-gms-key"
